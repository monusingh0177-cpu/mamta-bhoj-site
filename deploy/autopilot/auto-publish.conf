# systemd drop-in for AUTOMATIC PUBLISHING. It is installed only on request (install-autopilot.sh --auto-publish) and does
# nothing until AUTOPILOT_MODE=auto is set AND `node autopilot/cli.js activate-auto` has passed its readiness checks.
#
# The base unit keeps the whole file system read-only (ProtectSystem=strict; writable: the state directory and <repo>/.git).
# This drop-in adds write access to exactly two more places and nothing else:
#   * <repo>/views     - the SEO view files, the only files an automatic fix may change (the autopilot's own protected-path guard
#                        additionally refuses anything else)
#   * the PM2 home of the service user - `pm2 restart` writes its logs, pids and socket there
# data/, public/uploads/, .env, routes/, lib/, middleware/ and the rest of the file system stay read-only for the service.
[Service]
ReadWritePaths=@REPO@/views @PM2HOME@
