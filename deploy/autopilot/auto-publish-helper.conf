# systemd drop-in for AUTOMATIC PUBLISHING when the site is restarted through the root-owned restart helper
# (install-autopilot.sh --auto-publish --restart-helper). Nothing happens until AUTOPILOT_MODE=auto is set AND
# `node autopilot/cli.js activate-auto` has passed its readiness checks.
#
# The base unit keeps the whole file system read-only (ProtectSystem=strict; writable: the state directory and <repo>/.git).
# This drop-in adds write access to exactly two more places and nothing else:
#   * <repo>/views                              - the SEO view files, the only files an automatic fix may change
#   * /run/mamta-autopilot-restart/req          - where the service creates its restart REQUEST file (the "-" makes a missing
#                                                 directory harmless: the request script then reports it clearly)
# The service gets no sudo and no PM2 access; data/, public/uploads/, .env, routes/, lib/ and middleware/ stay read-only to it.
[Service]
ReadWritePaths=@REPO@/views -/run/mamta-autopilot-restart/req
