name: autopilot-tests

# Linux coverage for the SEO autopilot: the full test suite (including the installer, the unit file, systemd-analyze, the
# credentials-file mode and the one-shot run) plus the secret-scan and shell-syntax checks. Nothing here deploys, touches a server
# or needs a secret: the suite uses fake Google/AI/IndexNow services and a throw-away git repository.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Shell syntax
        run: |
          for f in scripts/*.sh deploy/autopilot/*.sh; do bash -n "$f"; done
      - name: Secret-scan tests
        run: bash scripts/test-secret-scan.sh
      - name: Autopilot tests (Linux: installer, systemd-analyze, file modes, one-shot run)
        run: node scripts/test-autopilot.js
