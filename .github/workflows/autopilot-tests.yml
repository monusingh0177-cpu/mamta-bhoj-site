name: autopilot-tests

# Linux coverage for the SEO autopilot: the full test suite (installer, unit file, systemd-analyze, credentials-file mode, one-shot
# run) plus the secret-scan and shell-syntax checks. Nothing here deploys, touches a server or needs a secret: the suite uses fake
# Google/AI/IndexNow services and a throw-away git repository.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'fix/**', 'feature/**']
  workflow_dispatch:

# least privilege: the default token can only read the repository
permissions:
  contents: read

# a newer push to the same branch or PR supersedes an older run
concurrency:
  group: autopilot-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux (Ubuntu) autopilot tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Shell syntax
        run: |
          for f in scripts/*.sh deploy/autopilot/*.sh; do bash -n "$f"; done
      - name: Secret-scan tests
        run: bash scripts/test-secret-scan.sh
      - name: Deploy guard tests (protected paths)
        run: node scripts/test-deploy-guard.js
      - name: Opportunity funnel tests (opportunities vs proposals vs publications)
        run: node scripts/test-funnel.js
      - name: Gemini provider tests (fake Gemini server)
        run: node scripts/test-ai-gemini.js
      - name: AI budget tests (hard cap, concurrency, time zone, fail-closed)
        run: node scripts/test-ai-budget.js
      - name: Autopilot tests (installer, systemd-analyze, file modes, one-shot run)
        run: node scripts/test-autopilot.js
